# NQA — reverse-proxy unique : TLS à ajouter ici plus tard (voir DEPLOY.md).
# `set $upstream` + resolver : nginx re-résout les noms de conteneurs à chaque
# requête — évite les 502 quand on rebuild l'API ou le frontend sans recréer nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # server_name mondomaine.com;   # à définir quand un domainepointe vers le VPS

    client_max_body_size 25M;      # uploads d'images produits

    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interne Docker

    # Fichiers statiques Django (admin, DRF) et médias (images produits),
    # servis par nginx — Django ne les sert plus quand DEBUG=0.
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # Validation certificat Let's Encrypt (TLS, optionnel)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # En-têtes communs à tous les proxies (les locations héritent).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ── API Django (gunicorn) ──────────────────────────────────────────────
    set $api http://api:8000;
    location /api/ {
        proxy_pass $api;
    }
    # Admin Django sous /django-admin/ : /admin/ est réservé au back-office
    # Next.js (voir location / plus bas), sinon nginx renvoie le login Django.
    location /django-admin/ {
        proxy_pass $api;
    }
    location = /health {
        proxy_pass $api;
    }

    # ── Frontend Next.js (server standalone) ──────────────────────────────
    set $web http://web:3000;
    location / {
        proxy_pass $web;
    }
}
